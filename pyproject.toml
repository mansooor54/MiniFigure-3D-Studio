[build-system]
requires = ["setuptools>=75,<82", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "minifigure-3d-studio"
version = "0.1.0.dev0"
description = "Local-first Windows desktop workflow for creating and preparing miniature 3D figures."
readme = "README_EN.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.10,<6.11",
    "jsonschema>=4.23,<5",
    "platformdirs>=4.3,<5",
    "psutil>=6.1,<8",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "structlog>=25.1,<26",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7.6,<8",
    "cyclonedx-bom>=5,<8",
    "hypothesis>=6.120,<7",
    "mypy>=1.14,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "generators*"]
exclude = ["tests*", "viewer*", "blender_scripts*"]

[tool.pytest.ini_options]
minversion = "9.0.3"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"
markers = [
    "blender: requires a validated Blender runtime",
    "gpu: requires the supported GPU and engine runtime",
    "network: intentionally exercises an approved external network boundary",
    "package: requires a packaged Windows application",
    "slow: long-running integration or end-to-end test",
    "windows: requires native Windows behavior",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    ".venv",
    "assets/viewer/dist",
    "build",
    "dist",
    "engines",
    "models",
    "viewer/node_modules",
]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "generators"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = [
    "^assets/viewer/dist/",
    "^build/",
    "^dist/",
    "^viewer/node_modules/",
]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["app", "generators"]
omit = [
    "*/__pycache__/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
